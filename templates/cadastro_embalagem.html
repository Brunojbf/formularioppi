{% extends "base.html" %}

{% block title %}Cadastro de Embalagem{% endblock %}

{% block content %}
<div class="container centered">
  <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo da Empresa" class="logo" />
  <h1>Cadastro de Embalagem</h1>

  <form action="{{ url_for('cadastrar_embalagem') }}" method="post">
    <fieldset>
      <legend>Informações da Embalagem</legend>

      <label for="codigo">Código:</label>
      <input type="text" id="codigo" name="codigo" required />

      <label for="tipo">Tipo:</label>
      <select id="tipo" name="tipo" required>
        <option value="" selected disabled>Selecione</option>
        <option value="Standard">Standard</option>
        <option value="Not Standard">Not Standard</option>
        <option value="Especial">Especial</option>
      </select>

      <label for="material">Material:</label>
      <select id="material" name="material" required>
        <option value="" selected disabled>Selecione</option>
        <option value="Plástico">Plástico</option>
        <option value="Papelão">Papelão</option>
        <option value="Metálico">Metálico</option>
        <option value="Madeira">Madeira</option>
      </select>

            <label for="size">Tamanho:</label>
      <select id="size" name="size" required>
        <option value="" selected disabled>Selecione</option>
        <option value="Small Lot">Small Lot</option>
        <option value="Bulk Box">Bulk Box</option>
        <option value="Oversized">Oversized</option>
        <option value="Rack Especial">Rack Especial</option>
      </select>

      <label for="comprimento_ext">Comprimento Externo: (mm)</label>
      <input type="number" step="0.01" id="comprimento_ext" name="comprimento_ext" required />

      <label for="largura_ext">Largura Externa: (mm)</label>
      <input type="number" step="0.01" id="largura_ext" name="largura_ext" required />

      <label for="altura_ext">Altura Externa: (mm)</label>
      <input type="number" step="0.01" id="altura_ext" name="altura_ext" required />

      <label for="comprimento_int">Comprimento Interno: (mm)</label>
      <input type="number" step="0.01" id="comprimento_int" name="comprimento_int" required />

      <label for="largura_int">Largura Interna: (mm)</label>
      <input type="number" step="0.01" id="largura_int" name="largura_int" required />

      <label for="altura_int">Altura Interna: (mm)</label>
      <input type="number" step="0.01" id="altura_int" name="altura_int" required />

      <label for="tara">Tara:</label>
      <input type="number" step="0.01" id="tara" name="tara" required />

    </fieldset>

    <button type="submit" name="submitform">Cadastrar</button>
  </form>
</div>
{% endblock %}
